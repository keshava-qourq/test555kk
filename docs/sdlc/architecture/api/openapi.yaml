components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    admin_users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - created_at
    documents:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        format:
          type: string
        s3_key:
          type: string
        status:
          type: string
        error_message:
          type: string
        uploaded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - filename
      - format
      - s3_key
      - status
      - uploaded_by
      - created_at
      - updated_at
    document_chunks:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        content:
          type: string
        embedding:
          type: string
      required:
      - id
      - document_id
      - chunk_index
      - content
      - embedding
    conversations:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
        started_at:
          type: string
          format: date-time
      required:
      - id
      - session_id
      - started_at
    messages:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - conversation_id
      - role
      - content
      - created_at
    message_citations:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
      required:
      - id
      - message_id
      - document_id
    followup_requests:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        contact_email:
          type: string
        question:
          type: string
        consent_given:
          type: boolean
        status:
          type: string
        email_delivered:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - contact_email
      - question
      - consent_given
      - status
      - email_delivered
      - created_at
